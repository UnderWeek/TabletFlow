name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish, for example v0.1.1. Leave empty for build-only validation."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  OTD_REF: v0.6.7
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x64

    steps:
      - name: Checkout TabletFlow
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Checkout OpenTabletDriver
        uses: actions/checkout@v4
        with:
          repository: OpenTabletDriver/OpenTabletDriver
          ref: ${{ env.OTD_REF }}
          path: opentabletdriver

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build TabletFlow
        run: cargo build --release

      - name: Build OpenTabletDriver daemon
        id: build-daemon
        env:
          OTD_ROOT: ${{ github.workspace }}/opentabletdriver
          DOTNET_COMMAND: dotnet
        run: |
          daemon_path="$(./packaging/build-daemon.sh "${{ matrix.rid }}" build/otd)"
          echo "daemon_path=$daemon_path" >> "$GITHUB_OUTPUT"

      - name: Import code signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tabletflow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/tabletflow-cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CODESIGN_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Package macOS DMG
        env:
          OTD_DAEMON_PATH: ${{ steps.build-daemon.outputs.daemon_path }}
          OTD_LICENSE_PATH: ${{ github.workspace }}/opentabletdriver/LICENSE
          TABLETFLOW_ARCH: ${{ matrix.arch }}
          CODESIGN_IDENTITY: TabletFlow Self-Signed
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == "$RELEASE_TAG" ]]; then VERSION="0.1.0"; fi
          TABLETFLOW_VERSION="$VERSION" ./packaging/macos/package.sh dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabletFlow-macos-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Checkout TabletFlow
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Checkout OpenTabletDriver
        uses: actions/checkout@v4
        with:
          repository: OpenTabletDriver/OpenTabletDriver
          ref: ${{ env.OTD_REF }}
          path: opentabletdriver

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build TabletFlow
        run: cargo build --release

      - name: Build OpenTabletDriver daemon
        env:
          OTD_ROOT: ${{ github.workspace }}/opentabletdriver
          DOTNET_COMMAND: dotnet
        shell: bash
        run: ./packaging/build-daemon.sh win-x64 build/otd

      - name: Package Windows ZIP
        shell: pwsh
        env:
          OTD_DAEMON_DIR: ${{ github.workspace }}/build/otd
          OTD_LICENSE_PATH: ${{ github.workspace }}/opentabletdriver/LICENSE
          TABLETFLOW_BINARY_PATH: ${{ github.workspace }}/target/release/tabletflow.exe
        run: |
          $version = if ($env:RELEASE_TAG.StartsWith("v")) { $env:RELEASE_TAG.Substring(1) } else { "0.1.0" }
          ./packaging/windows/package.ps1 -OutputDirectory dist -Version $version

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabletFlow-windows-x64
          path: dist/*.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TabletFlow
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Checkout OpenTabletDriver
        uses: actions/checkout@v4
        with:
          repository: OpenTabletDriver/OpenTabletDriver
          ref: ${{ env.OTD_REF }}
          path: opentabletdriver

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgbm-dev \
            libinput-dev \
            libxcursor-dev \
            libx11-dev \
            libx11-xcb-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            xinput

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build TabletFlow
        run: cargo build --release

      - name: Build OpenTabletDriver daemon
        env:
          OTD_ROOT: ${{ github.workspace }}/opentabletdriver
          DOTNET_COMMAND: dotnet
        run: ./packaging/build-daemon.sh linux-x64 build/otd

      - name: Package Linux archive
        env:
          OTD_DAEMON_PATH: ${{ github.workspace }}/build/otd/OpenTabletDriver.Daemon
          OTD_LICENSE_PATH: ${{ github.workspace }}/opentabletdriver/LICENSE
          TABLETFLOW_ARCH: x64
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == "$RELEASE_TAG" ]]; then VERSION="0.1.0"; fi
          TABLETFLOW_VERSION="$VERSION" ./packaging/linux/package.sh dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabletFlow-linux-x64
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes with Haiku
        env:
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_PROVIDER_URL: ${{ secrets.AI_PROVIDER_URL }}
          AI_SECRET_KEY: ${{ secrets.AI_SECRET_KEY }}
        run: python3 scripts/release_notes.py > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "TabletFlow $VERSION" \
            --notes-file release-notes.md \
            dist/*
